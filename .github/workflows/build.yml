name: Build

# Every push: tests, the desktop apps for Windows, macOS and Linux, and the Docker image (published on ghcr.io).
# When main has a version in package.json that hasn't been released yet (or a v* tag is pushed), the downloads are
# published as a GitHub release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win32, arch: x64, flags: --win --x64, unpacked: dist/win-unpacked }
          - { os: macos-latest, platform: darwin, arch: arm64, flags: --mac --arm64, unpacked: dist/mac-arm64 }
          - { os: macos-latest, platform: darwin, arch: x64, flags: --mac --x64, unpacked: dist/mac }
          - { os: ubuntu-latest, platform: linux, arch: x64, flags: --linux --x64, unpacked: dist/linux-unpacked }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Get FFmpeg for ${{ matrix.platform }}-${{ matrix.arch }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          node scripts/fetch-ffmpeg.js ${{ matrix.platform }} ${{ matrix.arch }} 2>&1 | tee logs/ffmpeg.log
      - name: Get the speech model
        run: node scripts/fetch-models.js
      - name: Speech recognition for Intel Macs
        if: matrix.platform == 'darwin' && matrix.arch == 'x64'
        run: npm install --no-save --force sherpa-onnx-darwin-x64@$(node -p "require('./package.json').dependencies['sherpa-onnx-node']")
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder ${{ matrix.flags }} --publish never -c.extraMetadata.homepage=https://github.com/${{ github.repository }} 2>&1 | tee logs/build.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ${{ matrix.unpacked }}/commercial-splitter --smoke-test --no-sandbox 2>&1 | tee logs/smoke.log
      - name: Smoke test (Windows)
        if: matrix.platform == 'win32'
        shell: bash
        run: |
          set -o pipefail
          ./${{ matrix.unpacked }}/commercial-splitter.exe --smoke-test 2>&1 | tee logs/smoke.log
      - name: Smoke test (macOS)
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          set -o pipefail
          app=$(ls -d ${{ matrix.unpacked }}/*.app | head -1)
          bin=$(ls "$app/Contents/MacOS/" | head -1)
          if [ "${{ matrix.arch }}" = "x64" ]; then run=(arch -x86_64 "$app/Contents/MacOS/$bin"); else run=("$app/Contents/MacOS/$bin"); fi
          "${run[@]}" --smoke-test 2>&1 | tee logs/smoke.log
      - name: Report what went wrong
        if: failure()
        shell: bash
        run: |
          # The end of each log as an annotation, so it shows on the run's summary page.
          for f in logs/*.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 40 "$f" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$(basename "$f")::$msg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: commercial-splitter:test
      - name: Smoke test
        run: |
          mkdir -p videos && chmod 777 videos
          ffmpeg_cmd="ffmpeg -v error -f lavfi -i testsrc2=size=320x240:rate=30:duration=8 -f lavfi -i sine=duration=8 -c:v libx264 -c:a aac -shortest /videos/test.mp4"
          docker run --rm -v "$PWD/videos:/videos" --entrypoint sh commercial-splitter:test -c "$ffmpeg_cmd"
          docker run -d --name cs -p 8080:8080 -v "$PWD/videos:/videos" commercial-splitter:test
          for i in $(seq 1 30); do curl -sf localhost:8080/api/info && break; sleep 1; done
          curl -sf localhost:8080/api/info | grep '"found":true'
          curl -sf -X POST -H 'x-cs: 1' localhost:8080/api/analyze -d '{"path":"/videos/test.mp4"}' | tail -1 | grep '"type":"done"'
          docker logs cs
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/commercial-splitter
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.pkg.outputs.version }},enable={{is_default_branch}}
            type=sha
      - name: Build and publish (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    # A v* tag, or a push to main whose package.json version hasn't been released yet.
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: [desktop, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Which version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF_NAME}"; else tag="v$(node -p "require('./package.json').version")"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.new == 'true'
        with:
          path: downloads
          pattern: desktop-*
          merge-multiple: true
      - name: Create the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ls -la downloads
          cat > notes.md <<NOTES
          ## Downloads

          | System | File |
          | --- | --- |
          | Windows 10 / 11 | \`Commercial-Splitter-${TAG#v}-Windows-Setup.exe\` (installer) or \`…-win-x64.zip\` (no install) |
          | macOS, Apple silicon | \`Commercial-Splitter-${TAG#v}-macOS-arm64.dmg\` |
          | macOS, Intel | \`Commercial-Splitter-${TAG#v}-macOS-x64.dmg\` |
          | Linux | \`…-linux-x86_64.AppImage\` or \`…-linux-amd64.deb\` |
          | Docker (web app) | \`docker run -d -p 8080:8080 -v /path/to/videos:/videos ghcr.io/${GITHUB_REPOSITORY_OWNER}/commercial-splitter:${TAG#v}\` |

          The first time you start it, Windows and macOS ask whether to open an app from an unknown developer — see the README.
          NOTES
          gh release create "$TAG" downloads/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Commercial Splitter ${TAG#v}" --notes-file notes.md --generate-notes
